name: Daily Taiwan Stock PDF Broadcast

on:
  schedule:
    # UTC 23:00 等於台灣時間 (UTC+8) 隔天早上 07:00
    # 0 23 * * 0-4 代表週日到週四 UTC 23:00 執行 (即台灣時間週一至週五 07:00)
    - cron: '0 23 * * 0-4'
  workflow_dispatch: # 允許在頁面上點擊按鈕手動測試

jobs:
  run-automation:
    runs-on: ubuntu-latest
    steps:
      - name: 載入專案程式碼
        uses: actions/checkout@v3

      - name: 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安裝必要套件
        run: |
          pip install anthropic requests weasyprint

      - name: 執行 Python 自動化腳本
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python main.py
