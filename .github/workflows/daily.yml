name: Daily Taiwan Stock Report

on:
  schedule:
    # 台灣時間 06:40 執行 (UTC 時間為 22:40)
    # 提前設定可抵銷 GitHub 排程熱門時段的排隊延遲
    - cron: '40 22 * * *'
  workflow_dispatch: # 允許在 GitHub 頁面手動點擊執行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 強制設定系統時區為台北時間，確保時間計算精準
      - name: Set Timezone
        run: sudo timedatectl set-timezone Asia/Taipei

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser google-genai weasyprint

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python main.py

      - name: Commit and push updated PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add taiwan_stock_daily.pdf
          git commit -m "Auto update daily PDF report" || exit 0
          git push
