name: 台股盤前 AI 晨報自動推播

on:
  schedule:
    # 國際標準時間 UTC 23:00 等於台灣時間 UTC+8 的隔天早上 07:00
    # 0 23 * * 0-4 代表台灣時間週一至週五早上 07:00
    - cron: '32 11 * * 0-4'
  workflow_dispatch: # 支援手動按鈕觸發測試

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝套件依賴
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests feedparser

      - name: 執行晨報推播腳本
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          python main.py
