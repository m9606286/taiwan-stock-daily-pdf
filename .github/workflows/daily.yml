name: Daily Taiwan Stock Report

on:
  schedule:
    # 台灣時間 06:40 執行 (UTC 時間為 22:40)
    - cron: '40 22 * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 1. 強制設定系統時區為台北時間
      - name: Set Timezone
        run: sudo timedatectl set-timezone Asia/Taipei

      # 2. 安裝 Linux 中文字型，解決 WeasyPrint 渲染中文字變成亂碼/方塊問題
      - name: Install Chinese Fonts & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser google-genai weasyprint

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python main.py

      - name: Commit and push updated PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add taiwan_stock_daily.pdf
          git commit -m "Auto update daily PDF report" || exit 0
          git push
