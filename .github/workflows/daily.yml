name: Daily Taiwan Stock Report

on:
  schedule:
    - cron: '40 22 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Set Timezone
        run: sudo timedatectl set-timezone Asia/Taipei

      # 強制安裝全套中文字型並重建字型快取 (Fontconfig Cache)
      - name: Install Chinese Fonts & Rebuild Font Cache
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-wqy-zenhei fonts-wqy-microhei libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0
          sudo fc-cache -fv

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser google-genai weasyprint

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python main.py

      - name: Commit and push updated PDF
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add taiwan_stock_daily.pdf
          git commit -m "Auto update daily PDF report" || exit 0
          git push
