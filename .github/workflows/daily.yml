name: Daily Taiwan Stock Video Report

on:
  schedule:
    # 台灣時間平日 AM 07:00 (UTC 23:00)
    - cron: '0 23 * * 0-4'
  workflow_dispatch: # 允許手動點擊執行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Set Timezone
        run: sudo timedatectl set-timezone Asia/Taipei

      # 安裝影片渲染所需的系統工具（ffmpeg）與中文字型
      - name: Install System Dependencies (ffmpeg & fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-wqy-microhei

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python main.py

      - name: Commit and push video & image
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 動態檢查檔案是否存在才加入追蹤，徹底避免 pathspec 找不到檔案的報錯
          # || true 避免 bash set -e 在檔案不存在時因 [ -f ] 回傳 1 中斷流程
          [ -f daily_report.mp4 ] && git add -f daily_report.mp4 || true
          [ -f cover.png ] && git add -f cover.png || true
          [ -f narration.mp3 ] && git add -f narration.mp3 || true

          git commit -m "Auto update daily video report" || echo "No changes to commit"
          git push
